# AWS Secrets
apiVersion: v1
kind: Secret
metadata:
  name: aws-secrets
type: Opaque
data:
  aws_access: QUtJQVhFRE5SRjMzVlBTUDVNT04NCg==
  aws_secret: ZFNTZTlkN1FROFZocTV3cFcvSjBTRjRHVXlTMVZFcGxLcnpQQnYxSg0K
---
# ZooKeeper StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  labels:
    app: zookeeper
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:5.4.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          readinessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: zk-data
              mountPath: /var/lib/zookeeper/data
  volumeClaimTemplates:
    - metadata:
        name: zk-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
  clusterIP: None
---
# Kafka Headless Service
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker
spec:
  clusterIP: None
  selector:
    app: kafka-broker
  ports:
    - port: 9092
      targetPort: 9092
---
# Kafka StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  labels:
    app: kafka-broker
spec:
  serviceName: kafka-broker
  replicas: 1
  selector:
    matchLabels:
      app: kafka-broker
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: kafka
          image: confluentinc/cp-server:5.4.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper-0.zookeeper.default.svc.cluster.local:2181"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-broker-0.kafka-broker.default.svc.cluster.local:9092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS
              value: "kafka-broker-0.kafka-broker:9092"
            - name: CONFLUENT_METRICS_REPORTER_ZOOKEEPER_CONNECT
              value: "zookeeper-0.zookeeper.default.svc.cluster.local:2181"
            - name: CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS
              value: "1"
            - name: CONFLUENT_METRICS_ENABLE
              value: "true"
            - name: CONFLUENT_SUPPORT_CUSTOMER_ID
              value: "anonymous"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "/usr/bin/kafka-topics --bootstrap-server localhost:9092 --list || exit 1"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# Schema Registry Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry-service
  labels:
    app: schema-registry-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-registry-service
  template:
    metadata:
      labels:
        app: schema-registry-service
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              until nc -z kafka-broker-0.kafka-broker.default.svc.cluster.local 9092; do
                echo "Kafka not ready, sleeping 5s..."
                sleep 5
              done
              echo "Kafka is ready!"
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:5.4.0
          ports:
            - containerPort: 8081
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: "schema-registry-service"
            - name: SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL
              value: "zookeeper:2181"
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "PLAINTEXT://kafka-broker-0.kafka-broker:9092"
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8081"
          readinessProbe:
            httpGet:
              path: /subjects
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
# Schema Registry Service
apiVersion: v1
kind: Service
metadata:
  name: schema-registry-service
spec:
  selector:
    app: schema-registry-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
---
# Panda Vendor Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panda-vendor-service
  labels:
    app: panda-vendor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panda-vendor-service
  template:
    metadata:
      labels:
        app: panda-vendor-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: panda-vendor-service
          image: nisithpanda/panda-vendor-service:1.5
          securityContext:
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 5000
          env:
            - name: SPRING_APPLICATION_NAME
              value: "panda-vendor-management"
            - name: SERVER_PORT
              value: "5000"
            - name: EUREKA_CLIENT_ENABLED
              value: "false"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://hungry-panda-eureka-server:8761/eureka/"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-broker-0.kafka-broker:9092"
            - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
              value: "org.apache.kafka.common.serialization.StringSerializer"
            - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
              value: "io.confluent.kafka.serializers.KafkaAvroSerializer"
            - name: SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL
              value: "http://schema-registry-service:8081"
            - name: SPRING_KAFKA_PROPERTIES_VALUE_SUBJECT_NAME_STRATEGY
              value: "io.confluent.kafka.serializers.subject.RecordNameStrategy"
            - name: SPRING_KAFKA_PROPERTIES_SPECIFIC_AVRO_READER
              value: "true"
            - name: AWS_ACCESS_KEY_ID_FILE
              value: "/run/secrets/aws_access"
            - name: AWS_SECRET_ACCESS_KEY_FILE
              value: "/run/secrets/aws_secret"
            - name: AWS_REGION
              value: "eu-central-1"
          volumeMounts:
            - name: aws-secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 5000
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: aws-secrets
          secret:
            secretName: aws-secrets
---
# Panda Vendor Service - ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: panda-vendor-service
spec:
  selector:
    app: panda-vendor-service
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
